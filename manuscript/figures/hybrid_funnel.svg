<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid corroboration funnel</title>
  <desc id="desc">The locked test is narrowed by calibrated conformal acceptance and Semgrep evidence; their intersection produces 452 accepted alerts at 7.96 percent precision.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#1f2937} .box{fill:#eef0ff;stroke:#4f46e5;stroke-width:2} .final{fill:#e4f5f3;stroke:#087f81;stroke-width:2} .arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)} .head{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:18px}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
  <rect width="1100" height="390" fill="#ffffff"/>
  <rect class="box" x="25" y="140" width="210" height="100" rx="14"/>
  <text x="130" y="178" text-anchor="middle" class="head">Locked test</text><text x="130" y="207" text-anchor="middle" class="body">24,008 records</text>
  <rect class="box" x="335" y="50" width="275" height="110" rx="14"/>
  <text x="472" y="84" text-anchor="middle" class="head">Temperature + conformal</text><text x="472" y="117" text-anchor="middle" class="body">2,319 alerts · 4.66% precision</text>
  <rect class="box" x="335" y="230" width="275" height="110" rx="14"/>
  <text x="472" y="264" text-anchor="middle" class="head">Semgrep only</text><text x="472" y="297" text-anchor="middle" class="body">1,514 alerts · 6.87% precision</text>
  <rect class="final" x="765" y="125" width="300" height="140" rx="14"/>
  <text x="915" y="163" text-anchor="middle" class="head">Intersection hybrid</text><text x="915" y="198" text-anchor="middle" class="body">452 alerts · 7.96% precision</text><text x="915" y="232" text-anchor="middle" class="body">98.12% abstained</text>
  <path class="arrow" d="M235,175 C275,175 290,105 335,105"/><path class="arrow" d="M235,205 C275,205 290,285 335,285"/>
  <path class="arrow" d="M610,105 C680,105 700,175 765,175"/><path class="arrow" d="M610,285 C680,285 700,215 765,215"/>
  <text x="550" y="375" text-anchor="middle" class="note">The final queue requires both calibrated acceptance and independent rule evidence.</text>
</svg>

