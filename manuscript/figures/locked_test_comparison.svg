<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <title>Official locked-test comparison</title>
  <rect width="1100" height="620" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263746">
    <text x="550" y="38" font-size="25" text-anchor="middle" font-weight="bold">Official locked-test comparison</text>
    <text x="550" y="66" font-size="16" text-anchor="middle">Higher bars are better within each metric; abstention is explicit.</text>
    <line x1="100" y1="520" x2="1035" y2="520" stroke="#607080" stroke-width="2"/>
    <line x1="100" y1="100" x2="100" y2="520" stroke="#607080" stroke-width="2"/>
    <g font-size="14" fill="#526273"><text x="88" y="525" text-anchor="end">0</text><text x="88" y="425" text-anchor="end">25</text><text x="88" y="325" text-anchor="end">50</text><text x="88" y="225" text-anchor="end">75</text><text x="88" y="105" text-anchor="end">100</text></g>
    <g stroke="#d7dee5" stroke-width="1"><line x1="100" y1="420" x2="1035" y2="420"/><line x1="100" y1="320" x2="1035" y2="320"/><line x1="100" y1="220" x2="1035" y2="220"/><line x1="100" y1="120" x2="1035" y2="120"/></g>
    <g font-size="14" text-anchor="middle">
      <text x="180" y="555">Raw Qwen</text><text x="390" y="555">Temp.+conf.</text><text x="600" y="555">Semgrep</text><text x="810" y="555">Frozen hybrid</text>
    </g>
    <g fill="#2d628f"><rect x="145" y="123" width="32" height="397"/><rect x="355" y="481" width="32" height="39"/><rect x="565" y="495" width="32" height="25"/><rect x="775" y="512" width="32" height="8"/></g>
    <g fill="#23806d"><rect x="183" y="512" width="32" height="8"/><rect x="393" y="501" width="32" height="19"/><rect x="603" y="493" width="32" height="27"/><rect x="813" y="488" width="32" height="32"/></g>
    <g fill="#b66b18"><rect x="221" y="153" width="32" height="367"/><rect x="431" y="437" width="32" height="83"/><rect x="641" y="441" width="32" height="79"/><rect x="851" y="492" width="32" height="28"/></g>
    <g font-size="13"><text x="160" y="115">99.08</text><text x="199" y="505">2.01</text><text x="237" y="145">91.76</text><text x="790" y="505">1.88</text><text x="828" y="481">7.96</text><text x="866" y="484">6.90</text></g>
    <g font-size="15"><rect x="890" y="95" width="16" height="16" fill="#2d628f"/><text x="915" y="108">Coverage</text><rect x="890" y="122" width="16" height="16" fill="#23806d"/><text x="915" y="135">Precision</text><rect x="890" y="149" width="16" height="16" fill="#b66b18"/><text x="915" y="162">Recall</text></g>
  </g>
</svg>

