<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Operational value of selective triage</title>
  <desc id="desc">The frozen hybrid reduces alert load from 99.08 percent to 1.88 percent and raises accepted-alert precision from 2.01 percent to 7.96 percent.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#1f2937} .axis{stroke:#374151;stroke-width:2} .grid{stroke:#d1d5db;stroke-dasharray:5 5} .raw{fill:#6d72f6} .hybrid{fill:#075f61} .small{font-size:18px} .label{font-size:20px} .value{font-size:22px;font-weight:700} .callout{fill:#fff3e5;stroke:#d97706;stroke-width:2}</style>
  <rect width="1000" height="430" fill="#ffffff"/>
  <rect class="callout" x="365" y="18" width="270" height="65" rx="12"/>
  <text x="500" y="44" text-anchor="middle" class="small">98.1% fewer alerts</text>
  <text x="500" y="68" text-anchor="middle" class="small">+5.95 percentage points precision</text>
  <g transform="translate(55,105)">
    <text x="185" y="0" text-anchor="middle" class="label">Alert load (% of test records)</text>
    <line class="grid" x1="0" y1="50" x2="370" y2="50"/><line class="grid" x1="0" y1="145" x2="370" y2="145"/>
    <line class="axis" x1="0" y1="240" x2="370" y2="240"/><line class="axis" x1="0" y1="35" x2="0" y2="240"/>
    <rect class="raw" x="65" y="42" width="70" height="198"/><rect class="hybrid" x="235" y="236" width="70" height="4"/>
    <text x="100" y="30" text-anchor="middle" class="value">99.08%</text><text x="310" y="230" text-anchor="middle" class="value">1.88%</text>
    <text x="100" y="275" text-anchor="middle" class="label">Raw Qwen</text><text x="270" y="275" text-anchor="middle" class="label">Frozen hybrid</text>
    <text x="-12" y="245" text-anchor="end" class="small">0</text><text x="-12" y="150" text-anchor="end" class="small">50</text><text x="-12" y="55" text-anchor="end" class="small">100</text>
  </g>
  <g transform="translate(545,105)">
    <text x="185" y="0" text-anchor="middle" class="label">Accepted-alert precision (%)</text>
    <line class="grid" x1="0" y1="50" x2="370" y2="50"/><line class="grid" x1="0" y1="145" x2="370" y2="145"/>
    <line class="axis" x1="0" y1="240" x2="370" y2="240"/><line class="axis" x1="0" y1="35" x2="0" y2="240"/>
    <rect class="raw" x="65" y="192" width="70" height="48"/><rect class="hybrid" x="235" y="49" width="70" height="191"/>
    <text x="100" y="182" text-anchor="middle" class="value">2.01%</text><text x="270" y="39" text-anchor="middle" class="value">7.96%</text>
    <text x="100" y="275" text-anchor="middle" class="label">Raw Qwen</text><text x="270" y="275" text-anchor="middle" class="label">Frozen hybrid</text>
    <text x="-12" y="245" text-anchor="end" class="small">0</text><text x="-12" y="150" text-anchor="end" class="small">5</text><text x="-12" y="55" text-anchor="end" class="small">10</text>
  </g>
</svg>

